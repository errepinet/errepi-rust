[package]
name = "errepi-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust bindings for Errepi Net microservices"
authors = ["Valerio Faiuolo <valerio.faiuolo@errepinet.it>"]
license = "MIT"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tonic = "0.14.6"
tonic-prost = "0.14"
prost = "0.14.4"
prost-types = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
tonic-prost-build = "0.14.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
